services:

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    depends_on:
      - translator
      - fish_tts
      - musetalk
    volumes:
      - ./storage:/app/storage

  translator:
    build: ./services/translator
    ports:
      - "8005:8005"
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
    volumes:
      # ── whisper: point to NF4 checkpoint, NOT the original float16 dir ──────
      - ./checkpoints/whisper-nf4:/app/checkpoints/whisper-nf4:ro
      - ./checkpoints/grammarly:/app/checkpoints/grammarly
      - ./checkpoints/checker:/app/checkpoints/checker
      - ./checkpoints/translator:/app/checkpoints/translator
      - ./storage:/app/storage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  fish_tts:
    build: ./services/fish_tts
    ports:
      - "8003:8003"
    volumes:
      - ./checkpoints/fish_tts:/app/checkpoints
      - ./storage:/app/storage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  musetalk:
    build: ./services/musetalk
    ports:
      - "8004:8004"
    volumes:
      - ./checkpoints/musetalk:/app/checkpoints
      - ./storage:/app/storage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]